name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.18'

jobs:
  # Fast feedback: format, lint, and type errors surface in ~2 minutes without waiting for
  # containers to boot.
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx prisma generate --schema packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://placeholder/placeholder
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://placeholder/placeholder
      - run: npm run build
      - run: npx vitest run --dir packages --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  integration:
    name: Integration, isolation and permissions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: tessera
          POSTGRES_PASSWORD: tessera
          POSTGRES_DB: tessera_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tessera"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://tessera:tessera@localhost:5432/tessera_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      REDIS_QUEUE_URL: redis://localhost:6379/1
      NODE_ENV: test
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      STORAGE_BUCKET: tessera-test
      STORAGE_PUBLIC_URL: http://localhost:9000/tessera-test
      SESSION_SECRET: test-session-secret-at-least-32-characters
      JWT_SECRET: test-jwt-secret-at-least-32-characters-x
      ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyEh
      MAIL_DRIVER: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate:deploy
      - run: npm run db:secure
      - run: npm run test:integration

      # These two suites gate the merge on their own. A cross-tenant read or a permission
      # regression is not a "fix it in the next PR" class of defect.
      - name: Tenant isolation
        run: npx vitest run --dir packages/testing/src/isolation
      - name: Permission matrix
        run: npx vitest run --dir packages/permissions/test

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Fails the build on High and Critical only. Gating on every advisory in the transitive
      # tree trains people to bypass the gate, which is worse than not having one.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Static analysis
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/typescript p/owasp-top-ten p/secrets

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: End-to-end (critical flows)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose -f infra/compose/docker-compose.yml up -d
      - run: npm run build
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - name: Run tagged critical specs
        run: npm run test:e2e -- --grep @critical
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
