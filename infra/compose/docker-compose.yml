name: tessera

# Local development stack.
#
# Every service is pinned to a specific minor version rather than `latest`, so a colleague
# cloning the repo six months from now gets the same behaviour you have today. Health checks are
# real (a query, a ping, a readiness endpoint) rather than "is the port open", because a port
# that accepts connections while the database is still recovering is exactly the state that
# produces flaky first-run failures.

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: tessera
      POSTGRES_DB: tessera
      # Faster and more deterministic than the locale-aware default; matters because sort order
      # in tests should not depend on the host's locale.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      # Log anything slower than 200ms so slow queries are visible during development rather
      # than discovered in production.
      - -c
      - log_min_duration_statement=200
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tessera -d tessera']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    # AOF everysec: the queue instance must not lose jobs on restart. In production the cache
    # and queue are separate instances with different persistence and eviction policies.
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: tessera
      MINIO_ROOT_PASSWORD: tessera-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket once MinIO is up, so a fresh clone does not fail its first upload.
  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 tessera tessera-secret &&
      mc mb --ignore-existing local/tessera-local &&
      mc anonymous set none local/tessera-local &&
      echo 'bucket ready'
      "

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Security plugin off for local development only. Production runs with TLS and
      # authentication; see infra/k8s.
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20

  # Catches outbound mail so verification links, invitations, and password resets can be
  # inspected at http://localhost:8025 without configuring a real provider.
  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
  redis-data:
  minio-data:
  opensearch-data:
